name: Build UUF power optimization

on:
  push:
    branches:
      - perf-power-02

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf-power-02
          fetch-depth: 0

      - name: Apply validated power changes
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          # Bring over the already-tested smoothing/UNIT_POWER_UPDATE implementation.
          subprocess.run(["git", "fetch", "origin", "perf-power-01"], check=True)
          powerbar = subprocess.check_output(
              ["git", "show", "origin/perf-power-01:Elements/PowerBar.lua"],
              text=True,
          )

          helper_anchor = '''local function ShouldShowUnitPowerBar(unitFrame, unit, PowerBarDB)\n'''
          helper = '''local function ShouldUseLeanPowerUpdates(unit)\n    local normalizedUnit = UUF:GetNormalizedUnit(unit)\n    return normalizedUnit == "party" or normalizedUnit == "raid"\nend\n\n'''
          if helper not in powerbar:
              if helper_anchor not in powerbar:
                  raise SystemExit("PowerBar helper anchor missing")
              powerbar = powerbar.replace(helper_anchor, helper + helper_anchor, 1)

          create_anchor = '''    PowerBar.colorPower = PowerBarDB.ColourByType\n    PowerBar.colorClass = PowerBarDB.ColourByClass\n    ApplyPowerUpdateMode(PowerBar, PowerBarDB.Smooth)\n'''
          create_new = '''    PowerBar.colorPower = PowerBarDB.ColourByType\n    PowerBar.colorClass = PowerBarDB.ColourByClass\n    PowerBar.UUFSkipColorOnPowerUpdate = ShouldUseLeanPowerUpdates(unit)\n    ApplyPowerUpdateMode(PowerBar, PowerBarDB.Smooth)\n'''
          if create_new not in powerbar:
              if create_anchor not in powerbar:
                  raise SystemExit("Create PowerBar anchor missing")
              powerbar = powerbar.replace(create_anchor, create_new, 1)

          update_anchor = '''            unitFrame.Power.colorPower = PowerBarDB.ColourByType\n            unitFrame.Power.colorClass = PowerBarDB.ColourByClass\n            ApplyPowerUpdateMode(unitFrame.Power, PowerBarDB.Smooth)\n'''
          update_new = '''            unitFrame.Power.colorPower = PowerBarDB.ColourByType\n            unitFrame.Power.colorClass = PowerBarDB.ColourByClass\n            unitFrame.Power.UUFSkipColorOnPowerUpdate = ShouldUseLeanPowerUpdates(unit)\n            ApplyPowerUpdateMode(unitFrame.Power, PowerBarDB.Smooth)\n'''
          if update_new not in powerbar:
              if update_anchor not in powerbar:
                  raise SystemExit("Update PowerBar anchor missing")
              powerbar = powerbar.replace(update_anchor, update_new, 1)

          Path('Elements/PowerBar.lua').write_text(powerbar, encoding='utf-8', newline='\n')

          ouf_path = Path('Libraries/oUF/elements/power.lua')
          ouf = ouf_path.read_text(encoding='utf-8')
          old_path = '''local function Path(self, ...)\n\t--[[ Override: Power.Override(self, event, unit, ...)\n\tUsed to completely override the internal update function.\n\n\t* self  - the parent object\n\t* event - the event triggering the update (string)\n\t* unit  - the unit accompanying the event (string)\n\t* ...   - the arguments accompanying the event\n\t--]]\n\tdo\n\t\t(self.Power.Override or Update) (self, ...)\n\tend\n\n\tColorPath(self, ...)\nend\n'''
          new_path = '''local function Path(self, ...)\n\t--[[ Override: Power.Override(self, event, unit, ...)\n\tUsed to completely override the internal update function.\n\n\t* self  - the parent object\n\t* event - the event triggering the update (string)\n\t* unit  - the unit accompanying the event (string)\n\t* ...   - the arguments accompanying the event\n\t--]]\n\tlocal event = ...\n\tdo\n\t\t(self.Power.Override or Update) (self, ...)\n\tend\n\n\t-- Party/Raid power type, colour and connectivity are refreshed by their\n\t-- dedicated lifecycle events. UNIT_POWER_UPDATE only changes the value, so\n\t-- UUF can opt out of the comparatively expensive generic ColorPath here.\n\tif(not (event == 'UNIT_POWER_UPDATE' and self.Power.UUFSkipColorOnPowerUpdate)) then\n\t\tColorPath(self, ...)\n\tend\nend\n'''
          if new_path not in ouf:
              if old_path not in ouf:
                  raise SystemExit("oUF Power Path anchor missing")
              ouf = ouf.replace(old_path, new_path, 1)
          ouf_path.write_text(ouf, encoding='utf-8', newline='\n')

      - name: Commit production changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Elements/PowerBar.lua Libraries/oUF/elements/power.lua; then
            echo "Power patch already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Elements/PowerBar.lua Libraries/oUF/elements/power.lua
            git commit -m "Optimize group power updates"
            git push origin HEAD:perf-power-02
          fi
