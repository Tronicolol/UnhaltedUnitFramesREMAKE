name: Package raid health lean candidate

on:
  push:
    branches:
      - perf-raid-steady-01

permissions:
  contents: write

jobs:
  patch-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf-raid-steady-01
          fetch-depth: 0

      - name: Apply Party/Raid UNIT_HEALTH color skip
        shell: python
        run: |
          from pathlib import Path

          health_path = Path('Libraries/oUF/elements/health.lua')
          health = health_path.read_text(encoding='utf-8')

          old = "local function Path(self, ...)\n"
          new = "local function Path(self, event, unit, ...)\n"
          if health.count(old) != 1:
              raise SystemExit('health Path signature anchor mismatch')
          health = health.replace(old, new, 1)

          old = "\t\t(self.Health.UpdatePredictionSize or UpdatePredictionSize) (self, ...)\n"
          new = "\t\t(self.Health.UpdatePredictionSize or UpdatePredictionSize) (self, event, unit, ...)\n"
          if health.count(old) != 1:
              raise SystemExit('UpdatePredictionSize anchor mismatch')
          health = health.replace(old, new, 1)

          old = "\t\t(self.Health.Override or Update) (self, ...)\n"
          new = "\t\t(self.Health.Override or Update) (self, event, unit, ...)\n"
          if health.count(old) != 1:
              raise SystemExit('Health Override anchor mismatch')
          health = health.replace(old, new, 1)

          old = "\tColorPath(self, ...)\nend\n\nlocal function ForceUpdate"
          new = "\t-- Party/Raid health fill changes do not change class/reaction/static health colours.\n\t-- Their dedicated events still run ColorPath; skip only the hot UNIT_HEALTH path.\n\tif(not (event == 'UNIT_HEALTH' and self.Health.UUFSkipColorOnHealthUpdate)) then\n\t\tColorPath(self, event, unit, ...)\n\tend\nend\n\nlocal function ForceUpdate"
          if health.count(old) != 1:
              raise SystemExit('ColorPath tail anchor mismatch')
          health = health.replace(old, new, 1)
          health_path.write_text(health, encoding='utf-8', newline='\n')

          prediction_path = Path('Elements/HealPrediction.lua')
          prediction = prediction_path.read_text(encoding='utf-8')

          old = "local function InstallGroupLeanHealth(unitFrame)\n    local health = unitFrame and unitFrame.Health\n    if not health then return end\n    unitFrame.UUFGroupLeanHealth = true\n    health.Override = GroupLeanHealthOverride\n"
          new = "local function InstallGroupLeanHealth(unitFrame, unit)\n    local health = unitFrame and unitFrame.Health\n    if not health then return end\n    unitFrame.UUFGroupLeanHealth = true\n    health.Override = GroupLeanHealthOverride\n\n    -- Only Party/Raid opt into skipping generic Health ColorPath on UNIT_HEALTH.\n    -- Player/Target/Boss and other frames retain the stock oUF colour lifecycle.\n    local normalizedUnit = UUF:GetNormalizedUnit(unit)\n    health.UUFSkipColorOnHealthUpdate = normalizedUnit == 'party' or normalizedUnit == 'raid'\n"
          if prediction.count(old) != 1:
              raise SystemExit('InstallGroupLeanHealth anchor mismatch')
          prediction = prediction.replace(old, new, 1)

          old = "    InstallGroupLeanHealth(unitFrame)\n"
          new = "    InstallGroupLeanHealth(unitFrame, unit)\n"
          if prediction.count(old) != 1:
              raise SystemExit('InstallGroupLeanHealth call anchor mismatch')
          prediction = prediction.replace(old, new, 1)
          prediction_path.write_text(prediction, encoding='utf-8', newline='\n')

      - name: Commit candidate production change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Libraries/oUF/elements/health.lua Elements/HealPrediction.lua
          if git diff --cached --quiet; then
            echo "No production changes to commit"
          else
            git commit -m "Optimize Party/Raid health color updates"
            git push origin HEAD:perf-raid-steady-01
          fi

      - name: Package production files
        run: |
          mkdir -p package/Libraries/oUF/elements package/Elements
          cp Libraries/oUF/elements/health.lua package/Libraries/oUF/elements/health.lua
          cp Elements/HealPrediction.lua package/Elements/HealPrediction.lua

      - uses: actions/upload-artifact@v4
        with:
          name: UUF_perf-raid-steady-01_HEALTH-COLOR-SKIP
          path: package/
