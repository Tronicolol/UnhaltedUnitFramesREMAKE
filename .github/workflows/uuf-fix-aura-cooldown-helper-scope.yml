name: Build UUF aura cooldown helper scope fix

on:
  push:
    branches:
      - ui-aura-cooldown-01

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-aura-cooldown-01

      - name: Move cooldown helper before aura builders
        shell: python
        run: |
          from pathlib import Path

          path = Path('Core/Config/GUI.lua')
          text = path.read_text(encoding='utf-8')

          helper_start_marker = 'local function CreateCooldownTextStyleSettings(StyleContainerParent, CooldownTextStyleDB)\n'
          helper_end_marker = '\nlocal function CreateCooldownTextSettings(containerParent)\n'
          target_marker = 'local function CreateSpecificAuraSettings(containerParent, unit, auraDB)\n'

          helper_start = text.find(helper_start_marker)
          helper_end = text.find(helper_end_marker, helper_start)
          target_pos = text.find(target_marker)

          if helper_start < 0 or helper_end < 0 or target_pos < 0:
              raise SystemExit('Required helper/target anchors missing')

          helper_block = text[helper_start:helper_end]
          text = text[:helper_start] + text[helper_end:]

          target_pos = text.find(target_marker)
          text = text[:target_pos] + helper_block + '\n\n' + text[target_pos:]

          helper_pos = text.find(helper_start_marker)
          aura_pos = text.find(target_marker)
          global_pos = text.find('local function CreateCooldownTextSettings(containerParent)')

          if not (0 <= helper_pos < aura_pos < global_pos):
              raise SystemExit(f'Unexpected function order: helper={helper_pos}, aura={aura_pos}, global={global_pos}')
          if text.count(helper_start_marker) != 1:
              raise SystemExit('Cooldown helper count is not exactly one')

          path.write_text(text, encoding='utf-8', newline='\n')

      - name: Commit production fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Core/Config/GUI.lua
          git commit -m "Fix aura cooldown settings helper scope"
          git push origin HEAD:ui-aura-cooldown-01

      - name: Stage test ZIP
        shell: bash
        run: |
          mkdir -p patch/Core/Config patch/Core
          cp Core/Config/GUI.lua patch/Core/Config/GUI.lua
          cp Core/Defaults.lua patch/Core/Defaults.lua
          cp Core/Globals.lua patch/Core/Globals.lua

      - uses: actions/upload-artifact@v4
        with:
          name: UUF_ui-aura-cooldown-01_SCOPE-FIX
          path: patch/
          if-no-files-found: error
