name: Patch raid event driver

on:
  push:
    branches:
      - perf-raid-steady-01

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf-raid-steady-01
      - name: Patch oUF Health external event ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Libraries/oUF/elements/health.lua')
          text = path.read_text()

          old_core = """\t\tself:RegisterEvent('UNIT_HEALTH', Path)\n\t\tself:RegisterEvent('UNIT_MAXHEALTH', Path)\n\t\tself:RegisterEvent('UNIT_CONNECTION', Path)\n\n\t\tif(unit == 'party' or unit == 'raid') then\n\t\t\tself:RegisterEvent('PARTY_MEMBER_ENABLE', Path)\n\t\t\tself:RegisterEvent('PARTY_MEMBER_DISABLE', Path)\n\t\tend\n"""

          new_core = """\t\t-- Raid can opt into an Ellesmere-style external unit-event driver. The\n\t\t-- Health widget and all of its existing update functions remain owned by\n\t\t-- oUF; only the high-frequency event registrations move off the secure\n\t\t-- header child onto plain tracker frames.\n\t\tlocal externalEventDriver = element.UUFExternalEventDriver == true\n\n\t\tif(not externalEventDriver) then\n\t\t\tself:RegisterEvent('UNIT_HEALTH', Path)\n\t\t\tself:RegisterEvent('UNIT_MAXHEALTH', Path)\n\t\t\tself:RegisterEvent('UNIT_CONNECTION', Path)\n\n\t\t\tif(unit == 'party' or unit == 'raid') then\n\t\t\t\tself:RegisterEvent('PARTY_MEMBER_ENABLE', Path)\n\t\t\t\tself:RegisterEvent('PARTY_MEMBER_DISABLE', Path)\n\t\t\tend\n\t\tend\n"""

          if text.count(old_core) != 1:
              raise SystemExit(f'core registration block matches={text.count(old_core)}')
          text = text.replace(old_core, new_core, 1)

          old_prediction = """\t\tif(element.HealingAll or element.HealingPlayer or element.HealingOther or element.OverHealIndicator) then\n\t\t\tself:RegisterEvent('UNIT_HEAL_PREDICTION', Path)\n\t\tend\n\n\t\tif(element.DamageAbsorb or element.OverDamageAbsorbIndicator) then\n\t\t\tself:RegisterEvent('UNIT_ABSORB_AMOUNT_CHANGED', Path)\n\t\tend\n\n\t\tif(element.HealAbsorb or element.OverHealAbsorbIndicator) then\n\t\t\tself:RegisterEvent('UNIT_HEAL_ABSORB_AMOUNT_CHANGED', Path)\n\t\tend\n\n\t\tif(element.TempLoss) then\n\t\t\tself:RegisterEvent('UNIT_MAX_HEALTH_MODIFIERS_CHANGED', Path)\n\t\tend\n"""

          new_prediction = """\t\tif(not externalEventDriver) then\n\t\t\tif(element.HealingAll or element.HealingPlayer or element.HealingOther or element.OverHealIndicator) then\n\t\t\t\tself:RegisterEvent('UNIT_HEAL_PREDICTION', Path)\n\t\t\tend\n\n\t\t\tif(element.DamageAbsorb or element.OverDamageAbsorbIndicator) then\n\t\t\t\tself:RegisterEvent('UNIT_ABSORB_AMOUNT_CHANGED', Path)\n\t\t\tend\n\n\t\t\tif(element.HealAbsorb or element.OverHealAbsorbIndicator) then\n\t\t\t\tself:RegisterEvent('UNIT_HEAL_ABSORB_AMOUNT_CHANGED', Path)\n\t\t\tend\n\n\t\t\tif(element.TempLoss) then\n\t\t\t\tself:RegisterEvent('UNIT_MAX_HEALTH_MODIFIERS_CHANGED', Path)\n\t\t\tend\n\t\tend\n"""

          if text.count(old_prediction) != 1:
              raise SystemExit(f'prediction registration block matches={text.count(old_prediction)}')
          text = text.replace(old_prediction, new_prediction, 1)

          path.write_text(text)
          PY

          git config user.name "Tronicolol"
          git config user.email "54152736+Tronicolol@users.noreply.github.com"
          git add Libraries/oUF/elements/health.lua
          if git diff --cached --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git commit -m "Route raid health events through plain trackers [skip ci]"
          git push
