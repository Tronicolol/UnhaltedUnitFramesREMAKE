name: Build UUF managed aura hide timer fix

on:
  push:
    branches:
      - ui-aura-cooldown-01

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-aura-cooldown-01

      - name: Apply managed Hide Timer fix
        shell: python
        run: |
          from pathlib import Path

          path = Path('Elements/Auras.lua')
          text = path.read_text(encoding='utf-8')

          marker = 'local function CreateManagedAuraDurationText(button, cooldown, unitFrame, unit)\n'
          helper = '''local function GetManagedCooldownTextStyleDB(unitFrame, unit)\n\tlocal globalCooldownDB = UUF.db.profile.General.CooldownText\n\tif globalCooldownDB.Advanced and unit then\n\t\tlocal unitDB = UUF:GetUnitDB(unitFrame, unit)\n\t\tif unitDB and unitDB.Auras and unitDB.Auras.AuraDuration then\n\t\t\treturn unitDB.Auras.AuraDuration\n\t\tend\n\tend\n\n\treturn globalCooldownDB\nend\n\n'''
          if helper not in text:
              if text.count(marker) != 1:
                  raise SystemExit('CreateManagedAuraDurationText anchor missing/duplicate')
              text = text.replace(marker, helper + marker, 1)

          old = '''\tlocal durationText = cooldown:CreateFontString(nil, "OVERLAY")\n\tbutton.UUFDurationText = durationText\n\n\tRefreshManagedAuraDurationFormatter()\n\tUUF:ApplyCooldownText(cooldown, durationText, unit, unitFrame, true)\n\n\tif button.SetDurationText then\n'''
          new = '''\tlocal durationText = cooldown:CreateFontString(nil, "OVERLAY")\n\tbutton.UUFDurationText = durationText\n\n\t-- Keep the swipe binding through SetDurationCooldown, but when Hide Timer is\n\t-- enabled do not hand a duration FontString to AuraButton at all. Blizzard\n\t-- owns SetDurationText visibility and may re-show a FontString that an addon\n\t-- merely hid after binding it. No duration binding means swipe-only reliably.\n\tlocal cooldownTextStyleDB = GetManagedCooldownTextStyleDB(unitFrame, unit)\n\tif cooldownTextStyleDB and cooldownTextStyleDB.HideTimer == true then\n\t\tdurationText:Hide()\n\t\treturn\n\tend\n\n\tRefreshManagedAuraDurationFormatter()\n\tUUF:ApplyCooldownText(cooldown, durationText, unit, unitFrame, true)\n\n\tif button.SetDurationText then\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Managed duration body anchor missing')

          old_sig = '''local function ManagedCooldownTextSignature(unitFrame, unit)\n\tlocal globalCooldownDB = UUF.db.profile.General.CooldownText\n\tlocal styleDB = globalCooldownDB\n\n\tif globalCooldownDB.Advanced and unit then\n\t\tlocal unitDB = UUF:GetUnitDB(unitFrame, unit)\n\t\tif unitDB and unitDB.Auras and unitDB.Auras.AuraDuration then\n\t\t\tstyleDB = unitDB.Auras.AuraDuration\n\t\tend\n\tend\n'''
          new_sig = '''local function ManagedCooldownTextSignature(unitFrame, unit)\n\tlocal globalCooldownDB = UUF.db.profile.General.CooldownText\n\tlocal styleDB = GetManagedCooldownTextStyleDB(unitFrame, unit)\n'''
          if old_sig in text:
              text = text.replace(old_sig, new_sig, 1)
          elif new_sig not in text:
              raise SystemExit('ManagedCooldownTextSignature anchor missing')

          sig_anchor = '''\tlocal parts = {\n\t\ttostring(globalCooldownDB.Advanced),\n\t\ttostring(styleDB.FontSize),\n'''
          sig_new = '''\tlocal parts = {\n\t\ttostring(globalCooldownDB.Advanced),\n\t\ttostring(styleDB.HideTimer == true),\n\t\ttostring(styleDB.FontSize),\n'''
          if sig_anchor in text:
              text = text.replace(sig_anchor, sig_new, 1)
          elif sig_new not in text:
              raise SystemExit('Cooldown signature parts anchor missing')

          if text.count('GetManagedCooldownTextStyleDB') < 3:
              raise SystemExit('Managed cooldown style helper not wired correctly')
          if 'tostring(styleDB.HideTimer == true)' not in text:
              raise SystemExit('HideTimer missing from managed signature')
          if 'if cooldownTextStyleDB and cooldownTextStyleDB.HideTimer == true then' not in text:
              raise SystemExit('Managed HideTimer early exit missing')

          path.write_text(text, encoding='utf-8', newline='\n')

      - name: Commit production fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Elements/Auras.lua
          git commit -m "Fix Hide Timer for managed aura cooldowns"
          git push origin HEAD:ui-aura-cooldown-01

      - name: Stage test ZIP
        shell: bash
        run: |
          mkdir -p patch/Core/Config patch/Core patch/Elements
          cp Core/Config/GUI.lua patch/Core/Config/GUI.lua
          cp Core/Defaults.lua patch/Core/Defaults.lua
          cp Core/Globals.lua patch/Core/Globals.lua
          cp Elements/Auras.lua patch/Elements/Auras.lua

      - uses: actions/upload-artifact@v4
        with:
          name: UUF_ui-aura-cooldown-01_HIDE-TIMER-FIX
          path: patch/
          if-no-files-found: error
