name: Package perf raid steady

on:
  push:
    branches:
      - perf-raid-steady-01

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build overlay ZIP
        run: |
          mkdir -p package/Elements package/Libraries/oUF/elements
          cp Elements/Init.xml package/Elements/Init.xml
          cp Elements/RaidEventDriver.lua package/Elements/RaidEventDriver.lua
          cp Elements/RealRaidFrameAB.lua package/Elements/RealRaidFrameAB.lua
          cp Elements/RealRaidIdleProfiler.lua package/Elements/RealRaidIdleProfiler.lua
          cp Libraries/oUF/elements/health.lua package/Libraries/oUF/elements/health.lua
          cd package
          zip -r ../UUF_perf-raid-steady-01_ELLESMERE-DRIVER.zip Elements Libraries

      - name: Upload overlay ZIP
        uses: actions/upload-artifact@v4
        with:
          name: UUF_perf-raid-steady-01_ELLESMERE-DRIVER
          path: UUF_perf-raid-steady-01_ELLESMERE-DRIVER.zip
          if-no-files-found: error
