name: Fix test aura preview font

on:
  push:
    branches:
      - perf-raid-steady-01

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf-raid-steady-01
          fetch-depth: 0

      - name: Guard fake aura duration text until font exists
        shell: python
        run: |
          from pathlib import Path

          path = Path('Elements/Auras.lua')
          text = path.read_text(encoding='utf-8')
          old = '                    button.Duration:SetText("10m")'
          new = '                    if button.Duration:GetFont() then button.Duration:SetText("10m") end'
          count = text.count(old)
          if count != 3:
              raise SystemExit(f'expected 3 fake duration SetText calls, found {count}')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8', newline='\n')

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Elements/Auras.lua
          git commit -m "Fix test aura preview duration font guard"
          git push origin HEAD:perf-raid-steady-01

      - name: Package file
        run: |
          mkdir -p package/Elements
          cp Elements/Auras.lua package/Elements/Auras.lua

      - uses: actions/upload-artifact@v4
        with:
          name: UUF_fix-show-auras-font
          path: package/
